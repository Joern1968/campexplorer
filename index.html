    :root{
      --bg:#0f172a; --panel:#111827; --muted:#9ca3af; --text:#e5e7eb;
      --accent:#22c55e; --accent-2:#60a5fa; --danger:#ef4444; --ok:#16a34a;
      --icon-stroke:#6b7280; --icon-blue:#3b82f6; --bar:#0b1220;
      --hero-h:min(25vh, 200px);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Arial;background:var(--bg);color:var(--text)}
    header{padding:14px 18px; display:flex; gap:12px; align-items:center; border-bottom:1px solid #1f2937; position:sticky; top:0; background:rgba(15,23,42,.98); z-index:100}
    header h1{margin:0; font-size:18px}
    header .hint{color:var(--muted); font-size:12px}
